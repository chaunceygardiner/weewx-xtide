# skins/xtide/lang/da.conf
#
# Danish -- Dansk.  Complete; Beta pending native-speaker review.
# Corrections welcome at
# https://github.com/chaunceygardiner/weewx-xtide/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "Tidal Events" = "Tidevand"
    "Tide forecasts." = "Tidevandsprognose."
    "2 Days" = "2 dage"
    "7 Days" = "7 dage"
    "30 Days" = "30 dage"
    "No tidal data to display.  Check the system log, and verify that the tide program runs as the WeeWX user and that the location in weewx.conf is valid." = "Ingen tidevandsdata at vise.  Tjek systemloggen, og kontrollér at programmet tide kører som WeeWX-brugeren, og at stedet i weewx.conf er gyldigt."

    # ── graph and event-list strings (xtide.py; the first three also
    #    reach xtide.js through the page's json payload) ──────────────────
    "High Tide" = "Højvande"
    "Low Tide" = "Lavvande"
    "{n} tidal events." = "{n} tidevandshændelser."
    "feet" = "fod"
    "meters" = "meter"
    "Tide ({unit})" = "Vandstand ({unit})"

    # ── date formats (strftime) ──────────────────────────────────────────
    # Day before month, 24-hour clock; the month and weekday NAMES come
    # from strftime, i.e. the weewxd process locale.
    "%a, %b %d, %Y %I:%M %p" = "%a %-d. %b %Y, %H:%M"
    "%a, %b %d, %Y %H:%M" = "%a %-d. %b %Y, %H:%M"
    "%I:%M %p" = "%H:%M"
    "%H:%M" = "%H:%M"
    "%I %p" = "%H"
    "%H" = "%H"
    "%a %d" = "%a %-d."
    "%b %d" = "%-d. %b"
