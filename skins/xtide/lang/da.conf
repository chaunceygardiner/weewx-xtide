# skins/xtide/lang/da.conf
#
# Danish -- Dansk.  Complete.
# Corrections welcome at
# https://github.com/chaunceygardiner/weewx-xtide/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "Tidal Events" = "Tidevand"
    "Tide forecasts." = "Tidevandsprognose."
    "2 Days" = "2 dage"
    "7 Days" = "7 dage"
    "30 Days" = "30 dage"
    "No tidal data to display.  Check the system log, and verify that the tide program runs as the WeeWX user and that the location in weewx.conf is valid." = "Ingen tidevandsdata at vise.  Tjek systemloggen, og kontrollér at programmet tide kører som WeeWX-brugeren, og at stedet i weewx.conf er gyldigt."

    # ── graph and event-list strings (xtide.py; the first three also
    #    reach xtide.js through the page's json payload) ──────────────────
    "High Tide" = "Højvande"
    "Low Tide" = "Lavvande"
    "{n} tidal events." = "{n} tidevandshændelser."
    "feet" = "fod"
    "meters" = "meter"
    "Tide ({unit})" = "Vandstand ({unit})"

    # ── the page's cards (index.html.tmpl) ───────────────────────────────
    "Right now" = "Lige nu"
    "Now" = "Nu"
    "Next" = "Næste"
    "Tide graph" = "Tidevandskurve"
    "today and tomorrow" = "i dag og i morgen"
    "from today" = "fra i dag"
    "Point at the curve, or tap it, to read the level at any moment.  The dashed red line is now." = "Peg på kurven, eller tryk på den, for at aflæse vandstanden på ethvert tidspunkt.  Den stiplede røde linje markerer det aktuelle tidspunkt."
    "Tide table" = "Tidevandstabel"
    "Tide" = "Tidevand"
    "Height" = "Højde"
    "Time" = "Tid"
    "When" = "Hvornår"
    "Heights are above the station's chart datum.  The list follows the tab above." = "Højderne er over stationens kortdatum.  Listen følger fanen ovenfor."
    "Harmonics data:" = "Harmoniske data:"
    "NOT FOR NAVIGATION" = "IKKE TIL NAVIGATION"

    # ── the Right now card's direction (xtide.py, through the json
    #    payload to xtide_now.js) ──────────────────────────────────────────
    "Rising" = "Stigende"
    "Falling" = "Faldende"

    # ── date formats (strftime) ──────────────────────────────────────────
    # Day before month, 24-hour clock; the month and weekday NAMES come
    # from strftime, i.e. the weewxd process locale.
    "%a, %b %-d, %-I:%M %p" = "%a %-d. %b, %H:%M"
    "%a, %b %-d, %H:%M" = "%a %-d. %b, %H:%M"
    "%I:%M %p" = "%H:%M"
    "%H:%M" = "%H:%M"
    "%I %p" = "%H"
    "%H" = "%H"
    "%a %-d" = "%a %-d."
    "%b %-d" = "%-d. %b"
