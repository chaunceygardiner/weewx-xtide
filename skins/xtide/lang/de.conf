# skins/xtide/lang/de.conf
#
# German -- Deutsch.  Complete; Beta pending native-speaker review.
# Corrections welcome at
# https://github.com/chaunceygardiner/weewx-xtide/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "Tidal Events" = "Gezeiten"
    "Tide forecasts." = "Gezeitenvorhersage."
    "2 Days" = "2 Tage"
    "7 Days" = "7 Tage"
    "30 Days" = "30 Tage"
    "No tidal data to display.  Check the system log, and verify that the tide program runs as the WeeWX user and that the location in weewx.conf is valid." = "Keine Gezeitendaten vorhanden.  Prüfen Sie das Systemprotokoll, und stellen Sie sicher, dass das Programm tide unter dem WeeWX-Benutzer läuft und der Ort in weewx.conf gültig ist."

    # ── graph and event-list strings (xtide.py; the first three also
    #    reach xtide.js through the page's json payload) ──────────────────
    "High Tide" = "Hochwasser"
    "Low Tide" = "Niedrigwasser"
    "{n} tidal events." = "{n} Gezeitenereignisse."
    "feet" = "Fuß"
    "meters" = "Meter"
    "Tide ({unit})" = "Wasserstand ({unit})"

    # ── date formats (strftime) ──────────────────────────────────────────
    # Day before month, 24-hour clock; the month and weekday NAMES come
    # from strftime, i.e. the weewxd process locale.
    "%a, %b %d, %Y %I:%M %p" = "%a, %-d. %b %Y, %H:%M"
    "%a, %b %d, %Y %H:%M" = "%a, %-d. %b %Y, %H:%M"
    "%I:%M %p" = "%H:%M"
    "%H:%M" = "%H:%M"
    "%I %p" = "%H"
    "%H" = "%H"
    "%a %d" = "%a %-d."
    "%b %d" = "%-d. %b"
