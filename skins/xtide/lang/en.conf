# skins/xtide/lang/en.conf
#
# English -- the tide page's reference dictionary.  Every string the page
# renders is here, and nothing else: tests/test_xtide.py fails if a key
# rendered by index.html.tmpl, xtide.py, xtide.js or xtide_now.js is
# missing from this file, or if this file carries a key nothing renders.
#
# Translations are gettext-style: the English string IS the key, and a
# report falls back to the English, one string at a time, for any key its
# language file does not carry -- a partial translation is fine.
# Composed strings keep their {named} placeholders; translators may
# reorder them but must not rename them.

[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "Tidal Events" = "Tidal Events"
    "Tide forecasts." = "Tide forecasts."
    "2 Days" = "2 Days"
    "7 Days" = "7 Days"
    "30 Days" = "30 Days"
    "No tidal data to display.  Check the system log, and verify that the tide program runs as the WeeWX user and that the location in weewx.conf is valid." = "No tidal data to display.  Check the system log, and verify that the tide program runs as the WeeWX user and that the location in weewx.conf is valid."

    # ── graph and event-list strings (xtide.py; the first three also
    #    reach xtide.js through the page's json payload) ──────────────────
    "High Tide" = "High Tide"
    "Low Tide" = "Low Tide"
    "{n} tidal events." = "{n} tidal events."
    "feet" = "feet"
    "meters" = "meters"
    "Tide ({unit})" = "Tide ({unit})"

    # ── the page's cards (index.html.tmpl) ───────────────────────────────
    "Right now" = "Right now"
    "Now" = "Now"
    "Next" = "Next"
    "Tide graph" = "Tide graph"
    "today and tomorrow" = "today and tomorrow"
    "from today" = "from today"
    "Point at the curve, or tap it, to read the level at any moment.  The dashed red line is now." = "Point at the curve, or tap it, to read the level at any moment.  The dashed red line is now."
    "Tide table" = "Tide table"
    "Tide" = "Tide"
    "Height" = "Height"
    "Time" = "Time"
    "When" = "When"
    "Heights are above the station's chart datum.  The list follows the tab above." = "Heights are above the station's chart datum.  The list follows the tab above."
    "Harmonics data:" = "Harmonics data:"
    "NOT FOR NAVIGATION" = "NOT FOR NAVIGATION"

    # ── the Right now card's direction (xtide.py, through the json
    #    payload to xtide_now.js) ──────────────────────────────────────────
    "Rising" = "Rising"
    "Falling" = "Falling"

    # ── date formats (strftime) ──────────────────────────────────────────
    # A translation reorders day and month and adjusts punctuation; the
    # month and weekday NAMES (%a, %b) come from strftime, i.e. the weewxd
    # process locale.  The %I/%p forms render on 12-hour systems, the
    # %H forms on 24-hour systems (empty AM/PM designators); a 24-hour
    # language translates BOTH to its 24-hour form, so its reports read
    # 24-hour on any host.
    "%a, %b %d, %Y %I:%M %p" = "%a, %b %d, %Y %I:%M %p"
    "%a, %b %d, %Y %H:%M" = "%a, %b %d, %Y %H:%M"
    "%I:%M %p" = "%I:%M %p"
    "%H:%M" = "%H:%M"
    "%I %p" = "%I %p"
    "%H" = "%H"
    "%a %d" = "%a %d"
    "%b %d" = "%b %d"
