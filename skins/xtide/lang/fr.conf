# skins/xtide/lang/fr.conf
#
# French -- Français.  Complete.
# Corrections welcome at
# https://github.com/chaunceygardiner/weewx-xtide/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "Tidal Events" = "Marées"
    "Tide forecasts." = "Prévisions de marées."
    "2 Days" = "2 jours"
    "7 Days" = "7 jours"
    "30 Days" = "30 jours"
    "No tidal data to display.  Check the system log, and verify that the tide program runs as the WeeWX user and that the location in weewx.conf is valid." = "Aucune donnée de marée à afficher.  Consultez le journal système et vérifiez que le programme tide s'exécute sous l'utilisateur WeeWX et que l'emplacement dans weewx.conf est valide."

    # ── graph and event-list strings (xtide.py; the first three also
    #    reach xtide.js through the page's json payload) ──────────────────
    "High Tide" = "Marée haute"
    "Low Tide" = "Marée basse"
    "{n} tidal events." = "{n} événements de marée."
    "feet" = "pieds"
    "meters" = "mètres"
    "Tide ({unit})" = "Marée ({unit})"

    # ── the page's cards (index.html.tmpl) ───────────────────────────────
    "Right now" = "En ce moment"
    "Now" = "Maintenant"
    "Next" = "Prochaine"
    "Tide graph" = "Courbe de marée"
    "today and tomorrow" = "aujourd'hui et demain"
    "from today" = "à partir d'aujourd'hui"
    "Point at the curve, or tap it, to read the level at any moment.  The dashed red line is now." = "Pointez la courbe, ou touchez-la, pour lire le niveau à tout moment.  La ligne rouge en pointillés indique l'heure actuelle."
    "Tide table" = "Table des marées"
    "Tide" = "Marée"
    "Height" = "Hauteur"
    "Time" = "Heure"
    "When" = "Quand"
    "Heights are above the station's chart datum.  The list follows the tab above." = "Les hauteurs sont rapportées au zéro hydrographique de la station.  La liste suit l'onglet ci-dessus."
    "Harmonics data:" = "Données harmoniques :"
    "NOT FOR NAVIGATION" = "NE PAS UTILISER POUR LA NAVIGATION"

    # ── the Right now card's direction (xtide.py, through the json
    #    payload to xtide_now.js) ──────────────────────────────────────────
    "Rising" = "Montante"
    "Falling" = "Descendante"

    # ── date formats (strftime) ──────────────────────────────────────────
    # Day before month, 24-hour clock; the month and weekday NAMES come
    # from strftime, i.e. the weewxd process locale.
    "%a, %b %d, %Y %I:%M %p" = "%a %-d %b %Y, %H:%M"
    "%a, %b %d, %Y %H:%M" = "%a %-d %b %Y, %H:%M"
    "%I:%M %p" = "%H:%M"
    "%H:%M" = "%H:%M"
    "%I %p" = "%H"
    "%H" = "%H"
    "%a %d" = "%a %-d"
    "%b %d" = "%-d %b"
