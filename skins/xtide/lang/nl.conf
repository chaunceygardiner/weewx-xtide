# skins/xtide/lang/nl.conf
#
# Dutch -- Nederlands.  Complete; Beta pending native-speaker review.
# Corrections welcome at
# https://github.com/chaunceygardiner/weewx-xtide/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "Tidal Events" = "Getijden"
    "Tide forecasts." = "Getijdenverwachting."
    "2 Days" = "2 dagen"
    "7 Days" = "7 dagen"
    "30 Days" = "30 dagen"
    "No tidal data to display.  Check the system log, and verify that the tide program runs as the WeeWX user and that the location in weewx.conf is valid." = "Geen getijdengegevens om weer te geven.  Controleer het systeemlog, en controleer of het programma tide onder de WeeWX-gebruiker draait en of de locatie in weewx.conf geldig is."

    # ── graph and event-list strings (xtide.py; the first three also
    #    reach xtide.js through the page's json payload) ──────────────────
    "High Tide" = "Hoogwater"
    "Low Tide" = "Laagwater"
    "{n} tidal events." = "{n} getijdengebeurtenissen."
    "feet" = "voet"
    "meters" = "meter"
    "Tide ({unit})" = "Waterstand ({unit})"

    # ── date formats (strftime) ──────────────────────────────────────────
    # Day before month, 24-hour clock; the month and weekday NAMES come
    # from strftime, i.e. the weewxd process locale.
    "%a, %b %d, %Y %I:%M %p" = "%a %-d %b %Y, %H:%M"
    "%a, %b %d, %Y %H:%M" = "%a %-d %b %Y, %H:%M"
    "%I:%M %p" = "%H:%M"
    "%H:%M" = "%H:%M"
    "%I %p" = "%H"
    "%H" = "%H"
    "%a %d" = "%a %-d"
    "%b %d" = "%-d %b"
