# skins/xtide/lang/no.conf
#
# Norwegian -- Norsk (bokmål).  Complete.
# Corrections welcome at
# https://github.com/chaunceygardiner/weewx-xtide/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "Tidal Events" = "Tidevann"
    "Tide forecasts." = "Tidevannsvarsel."
    "2 Days" = "2 dager"
    "7 Days" = "7 dager"
    "30 Days" = "30 dager"
    "No tidal data to display.  Check the system log, and verify that the tide program runs as the WeeWX user and that the location in weewx.conf is valid." = "Ingen tidevannsdata å vise.  Sjekk systemloggen, og kontroller at programmet tide kjører som WeeWX-brukeren, og at stedet i weewx.conf er gyldig."

    # ── graph and event-list strings (xtide.py; the first three also
    #    reach xtide.js through the page's json payload) ──────────────────
    "High Tide" = "Høyvann"
    "Low Tide" = "Lavvann"
    "{n} tidal events." = "{n} tidevannshendelser."
    "feet" = "fot"
    "meters" = "meter"
    "Tide ({unit})" = "Vannstand ({unit})"

    # ── the page's cards (index.html.tmpl) ───────────────────────────────
    "Right now" = "Akkurat nå"
    "Now" = "Nå"
    "Next" = "Neste"
    "Tide graph" = "Tidevannskurve"
    "today and tomorrow" = "i dag og i morgen"
    "from today" = "fra i dag"
    "Point at the curve, or tap it, to read the level at any moment.  The dashed red line is now." = "Pek på kurven, eller trykk på den, for å lese av vannstanden når som helst.  Den stiplede røde linjen markerer tidspunktet nå."
    "Tide table" = "Tidevannstabell"
    "Tide" = "Tidevann"
    "Height" = "Høyde"
    "Time" = "Tid"
    "When" = "Når"
    "Heights are above the station's chart datum.  The list follows the tab above." = "Høydene er over stasjonens sjøkartnull.  Listen følger fanen ovenfor."
    "Harmonics data:" = "Harmoniske data:"
    "NOT FOR NAVIGATION" = "IKKE FOR NAVIGASJON"

    # ── the Right now card's direction (xtide.py, through the json
    #    payload to xtide_now.js) ──────────────────────────────────────────
    "Rising" = "Stigende"
    "Falling" = "Synkende"

    # ── date formats (strftime) ──────────────────────────────────────────
    # Day before month, 24-hour clock; the month and weekday NAMES come
    # from strftime, i.e. the weewxd process locale.
    "%a, %b %-d, %-I:%M %p" = "%a %-d. %b, %H:%M"
    "%a, %b %-d, %H:%M" = "%a %-d. %b, %H:%M"
    "%I:%M %p" = "%H:%M"
    "%H:%M" = "%H:%M"
    "%I %p" = "%H"
    "%H" = "%H"
    "%a %-d" = "%a %-d."
    "%b %-d" = "%-d. %b"
