# skins/xtide/lang/sv.conf
#
# Swedish -- Svenska.  Complete.
# Corrections welcome at
# https://github.com/chaunceygardiner/weewx-xtide/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "Tidal Events" = "Tidvatten"
    "Tide forecasts." = "Tidvattenprognos."
    "2 Days" = "2 dagar"
    "7 Days" = "7 dagar"
    "30 Days" = "30 dagar"
    "No tidal data to display.  Check the system log, and verify that the tide program runs as the WeeWX user and that the location in weewx.conf is valid." = "Inga tidvattendata att visa.  Kontrollera systemloggen, och kontrollera att programmet tide körs som WeeWX-användaren och att platsen i weewx.conf är giltig."

    # ── graph and event-list strings (xtide.py; the first three also
    #    reach xtide.js through the page's json payload) ──────────────────
    "High Tide" = "Högvatten"
    "Low Tide" = "Lågvatten"
    "{n} tidal events." = "{n} tidvattenhändelser."
    "feet" = "fot"
    "meters" = "meter"
    "Tide ({unit})" = "Vattenstånd ({unit})"

    # ── the page's cards (index.html.tmpl) ───────────────────────────────
    "Right now" = "Just nu"
    "Now" = "Nu"
    "Next" = "Nästa"
    "Tide graph" = "Tidvattenkurva"
    "today and tomorrow" = "i dag och i morgon"
    "from today" = "från i dag"
    "Point at the curve, or tap it, to read the level at any moment.  The dashed red line is now." = "Peka på kurvan, eller tryck på den, för att läsa av vattenståndet när som helst.  Den streckade röda linjen markerar den aktuella tidpunkten."
    "Tide table" = "Tidvattentabell"
    "Tide" = "Tidvatten"
    "Height" = "Höjd"
    "Time" = "Tid"
    "When" = "När"
    "Heights are above the station's chart datum.  The list follows the tab above." = "Höjderna anges över stationens sjökortsnolla.  Listan följer fliken ovan."
    "Harmonics data:" = "Harmoniska data:"
    "NOT FOR NAVIGATION" = "INTE FÖR NAVIGERING"

    # ── the Right now card's direction (xtide.py, through the json
    #    payload to xtide_now.js) ──────────────────────────────────────────
    "Rising" = "Stigande"
    "Falling" = "Sjunkande"

    # ── date formats (strftime) ──────────────────────────────────────────
    # Day before month, 24-hour clock; the month and weekday NAMES come
    # from strftime, i.e. the weewxd process locale.
    "%a, %b %d, %Y %I:%M %p" = "%a %-d %b %Y, %H:%M"
    "%a, %b %d, %Y %H:%M" = "%a %-d %b %Y, %H:%M"
    "%I:%M %p" = "%H:%M"
    "%H:%M" = "%H:%M"
    "%I %p" = "%H"
    "%H" = "%H"
    "%a %d" = "%a %-d"
    "%b %d" = "%-d %b"
