# The page's language: WeeWX merges lang/<lang>.conf over this skin.conf.
lang = en

[Extras]
    version = 3.3

[CheetahGenerator]
    search_list_extensions = user.xtide.XTideVariables
    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl

[CopyGenerator]
    # copy_once, and it is the right directive.  "once" scopes to the first
    # report cycle of each weewxd RUN, not to "only if the file is absent":
    # reportengine guards the list with `if self.first_run`, and the copy
    # itself is a bare shutil.copy, an unconditional overwrite.  So every
    # restart -- which installing an extension requires anyway -- rewrites
    # these three from the skin, and an upgraded station cannot be left
    # serving the previous ones.  copy_always would also work but is not
    # free: deep_copy_path deliberately drops mtime, so the FTP and RSYNC
    # uploaders would re-send all three every report cycle, for ever.
    copy_once = xtide.css, xtide.js, xtide_now.js

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator

[Units]
    [[StringFormats]]
        foot = %.2f
